<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Cloud - AI Advertisement Concerns</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-cloud/1.2.5/d3.layout.cloud.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
            margin-bottom: 30px;
            font-size: 16px;
        }
        #wordcloud {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 20px;
        }
    </style>
</head>
<body>
    <h1>AI Chatbot Advertisement Concerns</h1>
    <p class="subtitle">Word Cloud Analysis of User Responses</p>
    <div id="wordcloud"></div>

    <script>
        const responses = [
            "Yes will disrupt information objectivity",
            "Unable to distinguish advertisements from objective information AI wants to convey such as product recommendations",
            "If products recommended by AI are interspersed with advertisements it will reduce my trust in responses given by AI and raise doubts about objectivity of its replies making me feel that its responses are more likely to be driven by capital and interests",
            "No",
            "I doubt the credibility of advertisement",
            "No",
            "I often use AI to choose products like headphones that need careful selection if there are advertisements wouldn't I have to think for myself",
            "This may affect people's perception of reliability of AI chatbot",
            "I am very worried will affect accuracy of information",
            "I am very worried AI tools contain advertisements because it will affect accuracy of information",
            "I'm really concerned about insertion of advertisements in AI software In our daily lives we use AI software almost every day If advertisements are very obvious we can identify them However for some hidden advertisements due to our trust in AI we often fail to notice their existence leading to unconscious biased choices This is very scary",
            "AI's answer might not remain objective",
            "I'm worried that I can't effectively identify advertisements I usually believe answers given by AI chatbot are objective",
            "I'm worried about giving excessive praise to certain advertisements",
            "No concerns",
            "Advertisements being included in AI chatbot responses may cause confusion between responses and ads",
            "Artificial intelligence generated advertisements may not understand their own products and because of hallucination problems generate false content thereby misleading consumers",
            "Yes I'm afraid AI will induce me to consume",
            "Worried will damage objectivity and credibility of provided information especially users may find it difficult to distinguish unbiased answers from paid content leading to receiving wrong information or being manipulated",
            "Worried about being provided wrong information worried about being induced to consume worried about lack of regulation and standards",
            "Unable to understand my emotional needs too mechanical",
            "I will question fairness and objectivity of AI robot thereby reducing frequency of my future use",
            "It makes answers from chatbot also suspicious leaving me wondering if they are biased and non-trustworthy",
            "May cause AI's selection tendency to deviate thereby possibly affecting correctness of AI reply",
            "Some concerns but acceptable Concerns mainly are 1 AI containing advertisements will make me doubt professionalism of results 2 soft ads are okay hard ads will make me resistant 3 targeted advertising will make me worry about privacy leakage",
            "Can't give me best answer if advertisements being included in AI",
            "I'm concerned that ads in AI chatbots could lead to biased information and poor user experience",
            "I am acceptable to having ads in AI chatbot as long as it provides some discount or promotions like several free chat opportunities But I am worried that ads will interfere with its answers or cause some misinformation",
            "No",
            "Lacks human charm",
            "Loss of trust and objectivity people choose to believe AI because of its neutrality and objectivity but involving ads users may begin to question whether information provided is genuinely helpful or just paid promotion",
            "I worry about accuracy and reliability of AI response if there are advertisements being included",
            "Yes I'm concerned Ads in chatbot responses may reduce trust making users doubt objectivity of answers They can also interrupt flow of conversation and feel intrusive If not clearly labeled or relevant they hurt overall user experience",
            "It may lower intelligence of AI",
            "Don't want introducing advertisements in AI chatbot should not be AI company's main profit method more should go API profit laugh",
            "1 ads should not appear before responses 2 ads should not appear too frequently 3 If ads do not match my preferences or reduces my efficiency eg when I try to generate codes ads recommend new iPhones to me I will choose other AI chatbots",
            "Nothing",
            "We need to pay more attention to authenticity of AI-generated ads and clarify any potential false advertising and who's responsible for it",
            "Will ads affect common use of AI Will unrelated ads appear in AI response Can users distinguish between normal response and ads Can users turn off generation of ads The content of ads is pre-written or generated by AI If latter who will be responsible for misinformation advertising language advertising law in different region",
            "No",
            "Advertisements may interrupt my thinking if they have no relation to my topic",
            "It may provide misleading information and it's difficult for users to distinguish ads from normal responses",
            "Ads may degrade usefulness of response eg suggesting sponsored solution instead of best solution",
            "My concern mainly lies in belief that quality of ads is consistently lower eg higher price lower servicing quality false advertising than quality of organic contents",
            "Responses may be influenced for profit of ads",
            "Response may not be accurate or at least I may not believe it",
            "1 Distract my thoughts when tackling problems using AI chatbots 2 Receive dishonest suggestions from chatbots due to need of advertisements",
            "Advertisements appearing in responses of large language models can lead people to question authenticity of those responses"
        ];

        const stopWords = new Set(['the', 'a', 'an', 'and', 'or', 'but', 'in', 'on', 'at', 'to', 'for', 'of', 'with', 'between', 'by', 'from', 'as', 'is', 'was', 'are', 'be', 'been', 'being', 'have', 'has', 'had', 'do', 'does', 'did', 'will', 'would', 'should', 'could', 'may', 'might', 'can', 'cant', 'it', 'its', 'that', 'this', 'these', 'those', 'i', 'me', 'my', 'we', 'our', 'if', 'they', 'them', 'their', 'not', 'no', '1', '2', '3', 'eg', 'etc', 'about', 'make', 'makes', 'made', 'making', 'more', 'some', 'very', 'there', 'when', 'who', 'what', 'where', 'which', 'how', 'because', 'due', 'such', 'than', 'so', 'too', 'also', 'just', 'up', 'out', 'into', 'over', 'after', 'am', 'im', 'yes', 'often', 'use', 'using', 'used', 'ai', 'chatbot', 'chatbots', 'advertisements', 'advertisement', 'advertising', 'ads', 'ad', 'included', 'being', 'responses', 'response', 'answers', 'answer', 'users', 'user', 'people', 'given', 'may', 'will', 'find', 'contain', 'containing', 'mainly', 'lies', 'eg', 'laugh', 'nothing', 'acceptable', 'concerns', 'concern', 'concerned', 'worried', 'worry', 'worries', 'afraid', 'information']);

        const wordNormalization = {
            'objectivity': 'objective',
            'trust': 'trust',
            'trustworthy': 'trust',
            'biased': 'bias',
            'misleading': 'misleading',
            'mislead': 'misleading',
            'misled': 'misleading',
            'misinformation': 'misinformation',
            'information': 'information',
            'credibility': 'credibility',
            'credible': 'credibility',
            'accuracy': 'accuracy',
            'accurate': 'accuracy',
            'inaccurate': 'accuracy',
            'reliable': 'reliability',
            'reliability': 'reliability',
            'unreliable': 'reliability',
            'distinguish': 'distinguish',
            'distinguishing': 'distinguish',
            'confused': 'confusion',
            'confusing': 'confusion',
            'confusion': 'confusion',
            'manipulation': 'manipulate',
            'manipulated': 'manipulate',
            'manipulating': 'manipulate',
            'influenced': 'influence',
            'influencing': 'influence',
            'influence': 'influence',
            'privacy': 'privacy',
            'false': 'false',
            'paid': 'paid',
            'promotion': 'promotion',
            'promotional': 'promotion',
            'interfere': 'interfere',
            'interference': 'interfere',
            'interrupt': 'interrupt',
            'interrupting': 'interrupt',
            'intrusive': 'intrusive',
            'helpful': 'helpful',
            'unhelpful': 'helpful',
            'believe': 'believe',
            'belief': 'believe',
            'neutrality': 'neutral',
            'neutral': 'neutral',
            'fairness': 'fairness',
            'fair': 'fairness',
            'unfair': 'fairness',
            'question': 'question',
            'questioning': 'question',
            'doubt': 'doubt',
            'doubts': 'doubt',
            'suspicious': 'suspicious',
            'suspect': 'suspicious',
            'distract': 'distract',
            'distracting': 'distract',
            'distraction': 'distract',
            'honest': 'honest',
            'dishonest': 'honest',
            'honesty': 'honest',
            'regulation': 'regulation',
            'regulations': 'regulation',
            'regulated': 'regulation',
            'authenticity': 'authenticity',
            'authentic': 'authenticity'
        };

        const wordFreq = {};
        
        responses.forEach(response => {
            const words = response.toLowerCase()
                .replace(/[^\w\s-]/g, ' ')
                .split(/\s+/)
                .filter(word => word.length > 2 && !stopWords.has(word));
            
            words.forEach(word => {
                const normalized = wordNormalization[word] || word;
                wordFreq[normalized] = (wordFreq[normalized] || 0) + 1;
            });
        });

        const wordData = Object.entries(wordFreq)
            .filter(([text, size]) => size > 1)
            .map(([text, size]) => ({ text, size: size * 10 }))
            .sort((a, b) => b.size - a.size)
            .slice(0, 80);

        const width = 1000;
        const height = 600;

        const layout = d3.layout.cloud()
            .size([width, height])
            .words(wordData)
            .padding(5)
            .rotate(() => ~~(Math.random() * 2) * 90)
            .font('Impact')
            .fontSize(d => d.size)
            .on('end', draw);

        layout.start();

        function draw(words) {
            const svg = d3.select('#wordcloud').append('svg')
                .attr('width', width)
                .attr('height', height)
                .append('g')
                .attr('transform', `translate(${width/2},${height/2})`);

            const color = d3.scaleOrdinal()
                .domain(words.map(d => d.text))
                .range(['#667eea', '#764ba2', '#f093fb', '#4facfe', '#43e97b', '#fa709a', '#fee140', '#30cfd0']);

            svg.selectAll('text')
                .data(words)
                .enter().append('text')
                .style('font-size', d => `${d.size}px`)
                .style('font-family', 'Impact')
                .style('fill', (d, i) => color(i))
                .attr('text-anchor', 'middle')
                .attr('transform', d => `translate(${d.x},${d.y})rotate(${d.rotate})`)
                .text(d => d.text)
                .style('opacity', 0)
                .transition()
                .duration(1000)
                .style('opacity', 1);
        }
    </script>
</body>
</html>
